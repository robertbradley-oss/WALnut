name: WALnut verification
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - name: Install browser and system dependencies
        run: node scripts/browser.mjs install --with-deps chromium
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:e2e
      - run: npm run test:replay
      - run: npm run release:prepare
      - name: Upload verified browser demo
        if: matrix.os == 'ubuntu-latest' && github.repository == 'robertbradley-oss/WALnut' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo/
      - uses: actions/upload-artifact@v4
        with:
          name: walnut-release-candidate-${{ matrix.os }}
          path: release/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            work/replay-report/
            work/replay-tests/
  deploy:
    if: github.repository == 'robertbradley-oss/WALnut' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified browser demo
        id: deployment
        uses: actions/deploy-pages@v4
